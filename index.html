<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sift 베타</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #141008; color: #EDE0CC; font-family: -apple-system, system-ui, sans-serif; }
  main { padding: 32px 24px; max-width: 360px; text-align: center; }
  /* The app's wordmark: 48pt regular, 6pt tracking, white-to-cheongja fill, three glows
     (cheongja 8, hwangto 18, cheongja 32). drop-shadow instead of text-shadow because a
     text-shadow paints over a gradient-clipped fill. */
  h1 { margin: 0 0 6px; padding-left: 6px; font-weight: 400; font-size: 48px; line-height: 1;
       letter-spacing: 6px; color: #F08020;
       background: linear-gradient(180deg, #FFFFFA 0%, #F08020 100%);
       -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
       filter: drop-shadow(0 0 8px rgba(240,128,32,0.85)) drop-shadow(0 0 18px rgba(232,180,0,0.45))
               drop-shadow(0 0 32px rgba(240,128,32,0.25)); }
  .tagline { margin: 18px 0 0; color: rgba(237,224,204,0.28); font-size: 11px; font-weight: 300; letter-spacing: 0.02em; }
  p { color: rgba(237,224,204,0.55); font-size: 14px; line-height: 1.6; }
  small { display: block; margin-top: 24px; color: rgba(237,224,204,0.35); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>SIFT</h1>
  <p class="tagline">밤사이, 가지런히</p>
  <p>첫 베타 빌드를 준비하고 있어요. 설치 버튼은 빌드가 올라오면 여기에 나타나요.</p>
  <small>등록된 기기에서만 설치돼요</small>
</main>
</body>
</html>
